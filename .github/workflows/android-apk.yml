
name: AAKNOVA Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build AAKNOVA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract AAKNOVA Project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/aaknova"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/aaknova"

          CONFIG=$(find "$RUNNER_TEMP/aaknova" -type f \
            \( -name "capacitor.config.ts" \
            -o -name "capacitor.config.json" \
            -o -name "capacitor.config.js" \) \
            -not -path "*/node_modules/*" -print -quit)

          if [ -z "$CONFIG" ]; then
            echo "ERROR: Capacitor configuration not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$CONFIG")

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # Fixed: npm cache disabled to avoid missing lockfile error
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fix Dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set "devDependencies.esbuild=^0.28.2"
          npm install --no-audit --no-fund

      - name: Verify Vite and esbuild
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npm ls vite esbuild

      - name: Build Web Application
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Android Project
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android/gradlew ]; then
            echo "ERROR: android/gradlew not found."
            exit 1
          fi

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            echo "ERROR: Android Gradle file not found."
            exit 1
          fi

      - name: Sync Capacitor Android
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload AAKNOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-APK
          path: ${{ steps.locate.outputs.project_dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
