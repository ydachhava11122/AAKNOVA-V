name: AAKNOVA Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'

permissions:
  contents: read

jobs:
  build:
    name: Build AAKNOVA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract AAKNOVA ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found in repository."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p _aaknova_unpacked
          unzip -q "$ZIP_FILE" -d _aaknova_unpacked

          echo "ZIP extracted successfully."

      - name: Find AAKNOVA Project Folder
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r PACKAGE_FILE; do
            DIR=$(dirname "$PACKAGE_FILE")

            if [ -f "$DIR/capacitor.config.ts" ] || \
               [ -f "$DIR/capacitor.config.js" ] || \
               [ -f "$DIR/capacitor.config.json" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find _aaknova_unpacked -type f -name package.json \
            -not -path '*/node_modules/*' | sort)

          if [ -z "$PROJECT_DIR" ]; then
            PACKAGE_FILE=$(find _aaknova_unpacked -type f \
              -name package.json -not -path '*/node_modules/*' \
              | head -n 1)

            if [ -n "$PACKAGE_FILE" ]; then
              PROJECT_DIR=$(dirname "$PACKAGE_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json not found inside ZIP."
            find _aaknova_unpacked -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "AAKNOVA project folder:"
          echo "$PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Install Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          npm install --no-audit --no-fund

      - name: Fix TypeScript Compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          npm install --no-save --package-lock=false typescript@5.9.3
          npx tsc --version

      - name: Build Web App
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          npm run build

      - name: Check Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ ! -d android ]; then
            echo "ERROR: Android folder is missing from the project."
            exit 1
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERROR: android/gradlew not found."
            exit 1
          fi

          echo "Android project found."

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
