
name: AAKNOVA Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!README.md'

permissions:
  contents: read

jobs:
  build:
    name: Build AAKNOVA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Fix TypeScript Compatibility
        run: |
          npm install --no-save --package-lock=false typescript@5.9.3
          npx tsc --version

      - name: Build Web App
        run: npm run build

      - name: Check Capacitor Configuration
        run: |
          if [ -f capacitor.config.ts ]; then
            echo "TypeScript Capacitor config found"
          elif [ -f capacitor.config.js ]; then
            echo "JavaScript Capacitor config found"
          elif [ -f capacitor.config.json ]; then
            echo "JSON Capacitor config found"
          else
            echo "ERROR: Capacitor config not found"
            exit 1
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload AAKNOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
