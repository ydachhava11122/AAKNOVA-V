
name: AAKNOVA Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'

permissions:
  contents: read

jobs:
  build:
    name: Build AAKNOVA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Project Files
        run: |
          echo "Checking project files..."
          ls -la
          test -f package.json || {
            echo "ERROR: package.json not found"
            exit 1
          }

      - name: Install Dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Fix TypeScript Compatibility
        run: |
          npm install --no-save --package-lock=false typescript@5.9.3
          npx tsc --version

      - name: Build Web App
        run: npm run build

      - name: Check Capacitor
        run: |
          npx cap --version
          test -f capacitor.config.ts || \
          test -f capacitor.config.js || \
          test -f capacitor.config.json || {
            echo "ERROR: Capacitor configuration missing"
            exit 1
          }

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AAKNOVA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
